apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: token-labs-gateway
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: glm47-flash-dynamo-agg-frontend
      port: 8000
      weight: 1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /v1
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /models/glm/v1
    timeouts:
      request: 3600s
  - backendRefs:
    - group: ''
      kind: Service
      name: qwen36-nvfp4-frontend
      port: 8000
      weight: 1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /v1
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /models/qwen/v1
    timeouts:
      request: 3600s
  - backendRefs:
    - group: ''
      kind: Service
      name: muse-glimmer-30b-frontend
      port: 8000
      weight: 1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /v1
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /models/muse/v1
    timeouts:
      request: 3600s
metadata:
  name: model-agent-apis
  namespace: token-labs
