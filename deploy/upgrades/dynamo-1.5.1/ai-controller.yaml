apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway-controller
  namespace: envoy-ai-gateway-system
  labels:
    app.kubernetes.io/instance: aieg
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ai-gateway-helm
    app.kubernetes.io/version: v1.1.0
    helm.sh/chart: ai-gateway-helm-1.1.0
  annotations:
    deployment.kubernetes.io/revision: '3'
    meta.helm.sh/release-name: aieg
    meta.helm.sh/release-namespace: envoy-ai-gateway-system
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: aieg
      app.kubernetes.io/name: ai-gateway-helm
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: aieg
        app.kubernetes.io/name: ai-gateway-helm
    spec:
      containers:
      - args:
        - -logLevel=info
        - -logFormat=text
        - --extProcImage=docker.io/envoyproxy/ai-gateway-extproc:v1.1.0
        - --extProcImagePullPolicy=IfNotPresent
        - --extProcLogLevel=info
        - --extProcLogFormat=text
        - --envoyGatewayNamespace=envoy-gateway-system
        - --endpointPrefixes=openai:,cohere:/cohere,anthropic:/anthropic
        - --tlsCertDir=/certs
        - --tlsCertName=tls.crt
        - --tlsKeyName=tls.key
        - --webhookPort=9443
        - --enableLeaderElection=true
        - --rootPrefix=/
        - --cacheSyncTimeout=2m
        - --watchNamespaces=
        - --quotaRateLimitServiceAddr=envoy-ai-gateway-ratelimit.envoy-gateway-system
        - --quotaRateLimitTimeout=5
        - --quotaRateLimitFailureModeDeny=false
        - --mcpSessionEncryptionSeed=default-insecure-seed
        - --mcpSessionEncryptionIterations=100000
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: localhost/token-labs/ai-gateway-controller@sha256:71cdab34040213143b8ece4ad1f10bd785d6db9abb34aa6c448831647f53995b
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 3
          grpc:
            port: 1063
            service: ''
          initialDelaySeconds: 5
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        name: ai-gateway-helm
        ports:
        - containerPort: 9443
          protocol: TCP
        - containerPort: 1063
          protocol: TCP
        - containerPort: 8080
          protocol: TCP
        - containerPort: 18002
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          grpc:
            port: 1063
            service: ''
          initialDelaySeconds: 5
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /certs
          name: certs
          readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: controller
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: ai-gateway-controller
      serviceAccountName: ai-gateway-controller
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - name: certs
        secret:
          defaultMode: 420
          secretName: self-signed-cert-for-mutating-webhook
