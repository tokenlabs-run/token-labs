    role\": \"assistant\", \"content\": delta},\n                    \"finish_reason\"\
    : finish_reason_type,\n                }\n                stop_reason = _extract_sglang_stop_reason(\n\
    \                    finish_reason, user_stop_token_ids\n                )\n\n\
    \                response = {\n                    \"id\": meta_info[\"id\"],\n\
