    import asyncio\nimport logging\nimport time\nfrom typing import Any, AsyncGenerator,\
    \ AsyncIterator, Dict, List, Mapping, Optional\n\nimport numpy as np\nimport sglang\
    \ as sgl\nimport torch\nfrom PIL.Image import Image as PILImage\nfrom sglang.srt.utils.video_decoder\
    \ import VideoDecoderWrapper\n\nfrom dynamo._core import Context\nfrom dynamo.common.backend\
    \ import logprobs as _shared_logprobs\nfrom dynamo.common.constants import DisaggregationMode\n\
    from dynamo.common.metadata_upload import MetadataUploader\nfrom dynamo.common.multimodal.image_loader\
    \ import ImageLoader\nfrom dynamo.common.multimodal.video_loader import VideoLoader\n\
    from dynamo.common.utils.engine_response import (\n    normalize_finish_reason,\n\
    \    trailing_stop_prefix_len,\n)\nfrom dynamo.llm import HttpError\nfrom dynamo.llm.exceptions\
    \ import EngineShutdown\nfrom dynamo.sglang._compat import (\n    filter_supported_async_generate_kwargs,\n\
    \    require_reasoning_kwargs,\n)\nfrom dynamo.sglang._disagg import validate_disagg_parallel_sampling\n\
    from dynamo.sglang.args import Config\nfrom dynamo.sglang.engine_generate import\
    \ (\n    build_native_generate_request,\n    native_generate_payload,\n    native_generate_stream,\n\
    )\nfrom dynamo.sglang.publisher import DynamoSglangPublisher\nfrom dynamo.sglang.request_handlers.handler_base\
    \ import BaseWorkerHandler\nfrom dynamo.sglang.request_handlers.llm.mm_disagg_utils\
    \ import (\n    AUDIO_URL_KEY,\n    IMAGE_URL_KEY,\n    VIDEO_URL_KEY,\n    build_disagg_mm_kwargs,\n\
    \    extract_media_urls,\n    raise_if_unextracted_multimodal,\n)\n\n_SAMPLING_OPTION_FIELDS\
    \ = (\n    \"presence_penalty\",\n    \"frequency_penalty\",\n    \"repetition_penalty\"\
    ,\n    \"temperature\",\n    \"top_p\",\n    \"top_k\",\n    \"min_p\",\n)\nBYPASS_REMOTE_PREFILL_ANNOTATION\
    \ = \"x-bypass-remote-prefill\"\n\n\ndef _raise_if_conditional_disagg_bypass(request:\
    \ Dict[str, Any]) -> None:\n    if BYPASS_REMOTE_PREFILL_ANNOTATION not in (request.get(\"\
    annotations\") or []):\n        return\n    raise HttpError(\n        400,\n \
    \       f\"Detected request annotation {BYPASS_REMOTE_PREFILL_ANNOTATION!r}, but\
    \ \"\n        \"SGLang backend does not support conditional disaggregation yet.\
    \ \"\n        \"Use vLLM or TensorRT-LLM for conditional disaggregation.\",\n\
    \    )\n\n\nclass FrontendDecodedVideo(np.ndarray, VideoDecoderWrapper):\n   \
    \ def __new__(\n        cls, video_frames: Any, video_metadata: Dict[str, Any]\n\
    \    ) -> \"FrontendDecodedVideo\":\n        video = np.ascontiguousarray(video_frames).view(cls)\n\
    \        duration = float(video_metadata.get(\"duration\") or 0)\n        source_fps\
    \ = float(video_metadata.get(\"fps\") or 0)\n        # TODO: SGLang does not yet\
    \ provide a model-independent contract for\n        # pre-sampled video inputs\
    \ with source frame indices and timestamps. Use the\n        # effective FPS as\
    \ a best-effort workaround until SGLang video processors can\n        # preserve\
    \ the supplied sampling metadata and skip redundant temporal sampling.\n     \
    \   effective_fps = len(video_frames) / duration if duration > 0 else source_fps\n\
    \        frame_indices = video_metadata.get(\"frames_indices\")\n        if (\n\
    \            source_fps > 0\n            and frame_indices is not None\n     \
    \       and len(frame_indices) == len(video_frames)\n            and len(frame_indices)\
    \ > 1\n        ):\n            span_frames = float(frame_indices[-1]) - float(frame_indices[0])\n\
    \            if span_frames > 0:\n                effective_fps = (len(video_frames)\
    \ - 1) * source_fps / span_frames\n        video._avg_fps = effective_fps\n  \
    \      if video._avg_fps <= 0:\n            raise ValueError(\"Frontend-decoded\
    \ video metadata must contain a valid fps\")\n        return video\n\n    def\
    \ __init__(self, video_frames: Any, video_metadata: Dict[str, Any]):\n       \
    \ pass\n\n    def __array_finalize__(self, source: Any) -> None:\n        if source\
    \ is not None:\n            self._avg_fps = getattr(source, \"_avg_fps\", 0.0)\n\
    \n    @property\n    def avg_fps(self) -> float:\n        return self._avg_fps\n\
    \n    def get_frames_as_tensor(self, indices: list[int]):\n        return torch.from_numpy(np.asarray(self)[indices])\n\
    \n    def get_frames_at(self, indices: list[int]):\n        return np.asarray(self)[indices]\n\
    \n    def close(self) -> None:\n        pass\n\n\ndef _as_sglang_video(frames:\
    \ Any, metadata: Dict[str, Any]) -> FrontendDecodedVideo:\n    \"\"\"Expose transferred\
    \ frames through SGLang's predecoded video contract.\"\"\"\n    return FrontendDecodedVideo(frames,\
    \ metadata)\n\n\ndef _nvext_extra_field_requested(request: Dict[str, Any], field:\
    \ str) -> bool:\n    nvext = request.get(\"nvext\")\n    extra_args = request.get(\"\
    extra_args\") or {}\n    extra_nvext = extra_args.get(\"nvext\") if isinstance(extra_args,\
    \ dict) else None\n\n    for source in (nvext, extra_nvext):\n        if not isinstance(source,\
    \ dict):\n            continue\n        extra_fields = source.get(\"extra_fields\"\
    )\n        if isinstance(extra_fields, list) and field in extra_fields:\n    \
    \        return True\n    return False\n\n\ndef _sampling_option_params(values:\
    \ Dict[str, Any]) -> Dict[str, Any]:\n    \"\"\"Extract sampling options that\
    \ SGLang accepts as sampling params.\"\"\"\n    params = {field: values.get(field)\
    \ for field in _SAMPLING_OPTION_FIELDS}\n    if values.get(\"seed\") is not None:\n\
    \        params[\"sampling_seed\"] = values.get(\"seed\")\n    return params\n\
    \n\ndef _user_stop_token_ids(request: Dict[str, Any]) -> set[int]:\n    stop_conditions\
    \ = request.get(\"stop_conditions\")\n    if isinstance(stop_conditions, dict):\n\
    \        return {\n            token_id\n            for token_id in (stop_conditions.get(\"\
    stop_token_ids\") or [])\n            if isinstance(token_id, int) and not isinstance(token_id,\
    \ bool)\n        }\n\n    stop = request.get(\"stop\")\n    if isinstance(stop,\
    \ list) and all(\n        isinstance(item, int) and not isinstance(item, bool)\
    \ for item in stop\n    ):\n        return set(stop)\n\n    return {\n       \
    \ token_id\n        for token_id in (request.get(\"stop_token_ids\") or [])\n\
    \        if isinstance(token_id, int) and not isinstance(token_id, bool)\n   \
    \ }\n\n\ndef _suppressed_stop_token_ids(request: Dict[str, Any]) -> set[int]:\n\
    \    stop_conditions = request.get(\"stop_conditions\") or {}\n    if not isinstance(stop_conditions,\
    \ dict):\n        return set()\n\n    values = [\n        *(stop_conditions.get(\"\
    stop_token_ids\") or []),\n        *(stop_conditions.get(\"stop_token_ids_hidden\"\
    ) or []),\n    ]\n    return {\n        token_id\n        for token_id in values\n\
    \        if isinstance(token_id, int) and not isinstance(token_id, bool)\n   \
    \ }\n\n\ndef _stop_strings(request: Dict[str, Any]) -> set[str]:\n    stop_conditions\
    \ = request.get(\"stop_conditions\")\n    stop = (\n        stop_conditions.get(\"\
    stop\")\n        if isinstance(stop_conditions, dict)\n        else request.get(\"\
    stop\")\n    )\n    if isinstance(stop, str):\n        return {stop}\n    if isinstance(stop,\
    \ list):\n        return {item for item in stop if isinstance(item, str)}\n  \
    \  return set()\n\n\ndef _remove_suppressed_stop_tokens(\n    output_ids: list[int],\n\
    \    matched: Any,\n    suppressed_stop_token_ids: set[int] | None,\n) -> tuple[list[int],\
    \ int]:\n    if not output_ids or not suppressed_stop_token_ids:\n        return\
    \ output_ids, 0\n\n    if isinstance(matched, int) and not isinstance(matched,\
    \ bool):\n        matched_ids = [matched]\n    elif isinstance(matched, list)\
    \ and all(\n        isinstance(item, int) and not isinstance(item, bool) for item\
    \ in matched\n    ):\n        matched_ids = matched\n    else:\n        return\
    \ output_ids, 0\n\n    if (\n        matched_ids\n        and all(token_id in\
    \ suppressed_stop_token_ids for token_id in matched_ids)\n        and len(output_ids)\
    \ >= len(matched_ids)\n        and output_ids[-len(matched_ids) :] == matched_ids\n\
    \    ):\n        return output_ids[: -len(matched_ids)], len(matched_ids)\n\n\
    \    return output_ids, 0\n\n\ndef _split_trailing_suppressed_stop_tokens(\n \
    \   output_ids: list[int],\n    suppressed_stop_token_ids: set[int] | None,\n\
    ) -> tuple[list[int], list[int]]:\n    if not output_ids or not suppressed_stop_token_ids:\n\
    \        return output_ids, []\n\n    split_at = len(output_ids)\n    while split_at\
    \ > 0 and output_ids[split_at - 1] in suppressed_stop_token_ids:\n        split_at\
    \ -= 1\n    return output_ids[:split_at], output_ids[split_at:]\n\n\ndef _openai_stop_sampling_params(request:\
    \ Dict[str, Any]) -> Dict[str, Any]:\n    stop = request.get(\"stop\")\n    if\
    \ isinstance(stop, str):\n        return {\"stop\": stop}\n    if isinstance(stop,\
    \ list):\n        if stop and all(\n            isinstance(item, int) and not\
    \ isinstance(item, bool) for item in stop\n        ):\n            return {\"\
    stop_token_ids\": stop}\n        if stop and all(isinstance(item, str) for item\
    \ in stop):\n            return {\"stop\": stop}\n\n    stop_token_ids = [\n \
    \       token_id\n        for token_id in (request.get(\"stop_token_ids\") or\
    \ [])\n        if isinstance(token_id, int) and not isinstance(token_id, bool)\n\
    \    ]\n    if stop_token_ids:\n        return {\"stop_token_ids\": stop_token_ids}\n\
    \    return {}\n\n\ndef _extract_sglang_stop_reason(\n    finish_reason: Dict[str,\
    \ Any] | None,\n    user_stop_token_ids: set[int] | None = None,\n) -> Any | None:\n\
    \    \"\"\"Extract SGLang's matched stop value for Dynamo's stop_reason field.\"\
    \"\"\n\n    if not finish_reason:\n        return None\n\n    matched = finish_reason.get(\"\
    matched\")\n    if isinstance(matched, bool):\n        return None\n    if isinstance(matched,\
    \ str):\n        return matched\n    if isinstance(matched, int):\n        if\
    \ user_stop_token_ids is not None and matched not in user_stop_token_ids:\n  \
    \          return None\n        return matched\n    if isinstance(matched, list)\
    \ and all(\n        isinstance(item, int) and not isinstance(item, bool) for item\
    \ in matched\n    ):\n        if user_stop_token_ids is not None and any(\n  \
    \          item not in user_stop_token_ids for item in matched\n        ):\n \
    \           return None\n        return matched\n\n    return None\n\n\nclass\
    \ DecodeWorkerHandler(BaseWorkerHandler):\n    \"\"\"Handler for decode workers\
    \ in both aggregated and disaggregated serving modes.\"\"\"\n\n    def __init__(\n\
    \        self,\n        engine: sgl.Engine,\n        config: Config,\n       \
    \ publisher: Optional[DynamoSglangPublisher] = None,\n        generate_endpoint=None,\n\
    \        shutdown_event: Optional[asyncio.Event] = None,\n        enable_frontend_decoding:\
    \ bool = False,\n        first_token_source: Any | None = None,\n    ) -> None:\n\
    \        \"\"\"Initialize decode worker handler.\n\n        Args:\n          \
    \  engine: The SGLang engine instance.\n            config: SGLang and Dynamo\
    \ configuration.\n            publisher: Metrics publisher for the worker.\n \
    \           shutdown_event: Optional event to signal shutdown.\n            generate_endpoint:\
    \ The endpoint handle for discovery registration.\n            enable_frontend_decoding:\
    \ If True, multimodal media arrives as\n                ``Decoded`` variants over\
    \ NIXL RDMA from the Rust frontend\n                and must be read before passing\
    \ to SGLang.\n                Off by default; the worker keeps the URL-string\
    \ fast path.\n            first_token_source: Endpoint-scoped prefill-completion\
    \ source.\n        \"\"\"\n        super().__init__(\n            engine,\n  \
    \          config,\n            publisher,\n            generate_endpoint,\n \
    \           shutdown_event,\n        )\n        # Resolve the optional return_routed_experts\
    \ kwarg once. Gating on the\n        # opt-in flag avoids sending the kwarg on\
    \ sglang builds whose\n        # Engine.async_generate does not declare it (notably\
    \ the deepseek_v4\n        # branch). Doing this at init keeps the per-request\
    \ hot path free of\n        # signature inspection.\n        self._routed_experts_kwargs:\
    \ Dict[\n            str, Any\n        ] = self._resolve_routed_experts_kwargs(self.engine,\
    \ self.config.server_args)\n        self._enable_frontend_decoding = enable_frontend_decoding\n\
    \        self._first_token_source = first_token_source\n        self._image_loader:\
    \ Optional[ImageLoader] = None\n        self._video_loader: Optional[VideoLoader]\
    \ = None\n        if self._enable_frontend_decoding:\n            # Lazy-inits\
    \ a NIXL connector internally for Decoded variants.\n            self._image_loader\
    \ = ImageLoader(enable_frontend_decoding=True)\n            self._video_loader\
    \ = VideoLoader(enable_frontend_decoding=True)\n        self._mm_hashes_supported:\
    \ bool = self._resolve_mm_hashes_supported(self.engine)\n        if self.serving_mode\
    \ == DisaggregationMode.DECODE:\n            logging.info(\n                \"\
    Decode worker handler initialized (disaggregated decode mode)\"\n            )\n\
    \        else:\n            mode = \"frontend-decoded\" if self._enable_frontend_decoding\
    \ else \"standard\"\n            logging.info(f\"Decode worker handler initialized\
    \ (aggregated mode, {mode})\")\n\n    @staticmethod\n    def _resolve_routed_experts_kwargs(engine:\
    \ Any, server_args: Any) -> Dict[str, Any]:\n        \"\"\"Resolve the return_routed_experts\
    \ kwarg for this engine.\n\n        Returns ``{\"return_routed_experts\": True}``\
    \ only when the user opted in\n        via ``enable_return_routed_experts=True``\
    \ AND the engine's\n        ``async_generate`` signature declares the kwarg. Returns\
    \ ``{}`` for the\n        default-off path and for sglang builds that do not declare\
    \ the kwarg\n        (e.g. the ``deepseek_v4`` branch).\n        \"\"\"\n    \
    \    if not getattr(server_args, \"enable_return_routed_experts\", False):\n \
    \           return {}\n        return filter_supported_async_generate_kwargs(\n\
    \            engine, {\"return_routed_experts\": True}\n        )\n\n    @staticmethod\n\
    \    def _resolve_mm_hashes_supported(engine: Any) -> bool:\n        \"\"\"Probe\
    \ whether engine.async_generate accepts ``mm_hashes``.\n\n        SGLang accepted\
    \ the kwarg starting with the upstream interop PR; older\n        builds (and\
    \ forks lacking the patch) raise TypeError if we pass it.\n        Probing the\
    \ signature once at init keeps the request hot path free of\n        repeated\
    \ inspection. Returns ``False`` when the kwarg is absent \u2014 the\n        request\
    \ still completes, MM-aware routing just falls back to the\n        text-prefix\
    \ overlap signal.\n        \"\"\"\n        probe = filter_supported_async_generate_kwargs(engine,\
    \ {\"mm_hashes\": None})\n        return \"mm_hashes\" in probe\n\n    @staticmethod\n\
    \    def _extract_mm_hashes(request: Dict[str, Any]) -> Optional[List[str]]:\n\
    \        \"\"\"Pull the per-image hashes the Rust frontend forwards via extra_args.\n\
    \n        Returns ``None`` when the field is absent or malformed; SGLang then\n\
    \        recomputes the hash internally via ``hash_feature()``.\n        \"\"\"\
    \n        extra_args = request.get(\"extra_args\")\n        if not isinstance(extra_args,\
    \ dict):\n            return None\n        mm_hashes = extra_args.get(\"mm_hashes\"\
