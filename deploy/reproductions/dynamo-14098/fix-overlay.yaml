    ) or 0\n\n                text = res.get(\"text\", \"\")\n\n                finish_reason\
    \ = meta_info[\"finish_reason\"]\n                if finish_reason:\n        \
    \            # Keep shutdown aborts retryable by the frontend.\n             \
