    \                       \"Engine was shut down during token generation\"\n   \
    \                     )\n                    finish_reason_type = normalize_finish_reason(finish_reason[\"\
    type\"])\n                else:\n                    finish_reason_type = None\n\
    \                next_count = len(text)\n                count = text_counts_per_choice.get(index,\
    \ 0)\n                visible_text_len = next_count\n                matched =\
    \ finish_reason.get(\"matched\") if finish_reason else None\n                if\
