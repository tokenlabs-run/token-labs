  disagg.py: "# SPDX-FileCopyrightText: Copyright (c) 2025-2026 NVIDIA CORPORATION\
    \ & AFFILIATES. All rights reserved.\n# SPDX-License-Identifier: Apache-2.0\n\n\
    \"\"\"Disaggregation helpers used by the SGLang worker.\n\n* :func:`compute_bootstrap_address`\
    \ \u2014 resolve the `(host, port)` pair a\n  prefill worker advertises to decode\
    \ peers from a live `sgl.Engine`.\n  Returns `(None, None)` on any failure so\
    \ callers can degrade gracefully.\n\n* :func:`get_sglang_worker_group_id` \u2014\
    \ normalize the SGLang multinode\n  `dist_init_addr` into a runtime-data key that\
    \ non-leader workers can use\n  to discover the leader endpoint.\n\n* :func:`warmup_prefill_engine`\
    \ \u2014 drive one request per DP rank through\n  the disagg path with SGLang's\
    \ `FAKE_BOOTSTRAP_HOST` so the first real\n  request doesn't pay the JIT/CUDA-graph\
    \ compile cost.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport asyncio\n\
    import logging\nfrom collections.abc import Mapping\nfrom typing import Any, Optional\n\
    \nimport sglang as sgl\n\nfrom dynamo.llm import HttpError\nfrom dynamo.sglang.engine_generate\
    \ import native_generate_payload\n\n# Matches the prior in-tree value. Long enough\
    \ for the slowest cold-start\n# we've seen (TP8 70B with FlashInfer JIT).\n_PREFILL_WARMUP_TIMEOUT_S\
    \ = 1800.0\n\nSGLANG_WORKER_GROUP_ID_KEY = \"sglang_worker_group_id\"\n\n\ndef\
    \ validate_disagg_parallel_sampling(request: Mapping[str, Any]) -> None:\n   \
    \ \"\"\"Reject parallel samples before creating a single-room KV handoff.\"\"\"\
    \n    inner_request = request.get(\"request\", request)\n    native_payload =\
    \ native_generate_payload(inner_request)\n    sampling_options = [\n        inner_request.get(\"\
    sampling_options\"),\n        request.get(\"sampling_params\"),\n        {\"n\"\
    : inner_request.get(\"n\")},\n    ]\n    if native_payload is not None:\n    \
    \    sampling_options.append(native_payload.get(\"sampling_params\"))\n    for\
    \ options in sampling_options:\n        if options is None:\n            continue\n\
    \        if not isinstance(options, Mapping):\n            raise HttpError(\n\
    \                400, \"SGLang disaggregated sampling parameters must be an object.\"\
    \n            )\n        if options.get(\"n\") not in (None, 1):\n           \
    \ # Prefill produces one bootstrap room. SGLang expands parallel\n           \
    \ # decode samples into independent transfers that cannot all finish.\n      \
    \      raise HttpError(\n                400,\n                \"SGLang disaggregated\
    \ serving supports only n=1. \"\n                \"Use aggregated serving or send\
    \ separate n=1 requests.\",\n            )\n\n\ndef _network_address_cls():\n\
    \    # Deferred to function body so pre-commit test collection can import\n  \
    \  # `_disagg` without the SGLang network helper available.\n    from sglang.srt.utils.network\
    \ import NetworkAddress\n\n    return NetworkAddress\n\n\ndef compute_bootstrap_address(\n\
    \    engine: sgl.Engine,\n) -> tuple[Optional[str], Optional[int]]:\n    \"\"\"\
    Return `(host, port)` for this prefill worker's bootstrap address.\n\n    Returns\
    \ `(None, None)` when the engine doesn't advertise a\n    `disaggregation_bootstrap_port`\
    \ or when address resolution raises.\n    Callers treat `(None, None)` as a soft\
    \ skip.\n    \"\"\"\n    # Deferred to function body so pre-commit test collection\
    \ can import\n    # `_disagg` without sglang installed.\n    from sglang.srt.utils.network\
    \ import NetworkAddress, get_local_ip_auto\n\n    try:\n        inner_tm = engine.tokenizer_manager\n\
    \        bootstrap_port = getattr(\n            inner_tm.server_args, \"disaggregation_bootstrap_port\"\
    , None\n        )\n        if bootstrap_port is None:\n            return None,\
    \ None\n\n        if inner_tm.server_args.dist_init_addr:\n            dist_init\
    \ = NetworkAddress.parse(inner_tm.server_args.dist_init_addr)\n            resolved\
    \ = dist_init.resolved()\n            bootstrap_host = (\n                NetworkAddress(resolved.host,\
    \ bootstrap_port)\n                .to_host_port_str()\n                .rsplit(\"\
    :\", 1)[0]\n            )\n            logging.info(\n                \"Resolved\
    \ bootstrap host '%s' -> '%s' (%s)\",\n                dist_init.host,\n     \
    \           resolved.host,\n                \"IPv6\" if resolved.is_ipv6 else\
    \ \"IPv4\",\n            )\n        else:\n            # SGLANG_HOST_IP overrides\
    \ auto-detection (use bracketed [addr]\n            # for IPv6); falls back to\
    \ a v4-then-v6 probe.\n            local_ip = get_local_ip_auto()\n          \
    \  local_addr = NetworkAddress(local_ip, bootstrap_port)\n            bootstrap_host\
    \ = local_addr.to_host_port_str().rsplit(\":\", 1)[0]\n            logging.info(\n\
    \                \"Using auto-detected local IP: %s (%s)\",\n                local_ip,\n\
    \                \"IPv6\" if local_addr.is_ipv6 else \"IPv4\",\n            )\n\
    \        return bootstrap_host, bootstrap_port\n    except Exception as e:\n \
    \       logging.warning(\"Failed to compute bootstrap address: %s\", e)\n    \
    \    return None, None\n\n\ndef get_sglang_worker_group_id(server_args) -> Optional[str]:\n\
    \    \"\"\"Return the shared SGLang multi-node worker group id.\"\"\"\n    nnodes\
    \ = getattr(server_args, \"nnodes\", 1) or 1\n    if nnodes <= 1:\n        return\
    \ None\n\n    dist_init_addr = getattr(server_args, \"dist_init_addr\", None)\n\
    \    if not dist_init_addr:\n        logging.warning(\n            \"SGLang multi-node\
    \ worker group id requires dist_init_addr; \"\n            \"falling back to local\
    \ worker id behavior\"\n        )\n        return None\n\n    try:\n        parsed\
    \ = _network_address_cls().parse(str(dist_init_addr).strip())\n        resolved\
    \ = parsed.resolved()\n        return f\"dist_init:{resolved.to_tcp()}\"\n   \
    \ except Exception as e:\n        logging.warning(\n            \"Failed to normalize\
    \ SGLang dist_init_addr=%r for worker group id: %s\",\n            dist_init_addr,\n\
    \            e,\n        )\n        return None\n\n\nasync def warmup_prefill_engine(engine:\
    \ sgl.Engine, bootstrap_port: int) -> None:\n    \"\"\"Warm every prefill DP rank\
    \ through the disagg path.\n\n    Uses SGLang's `FAKE_BOOTSTRAP_HOST` so JIT/CUDA-graph\
    \ compile happens\n    before the first real request. Raises on timeout/failure\
    \ \u2014 an unwarmed\n    prefill silently drops production requests.\n    \"\"\
    \"\n    from sglang.srt.disaggregation.utils import FAKE_BOOTSTRAP_HOST\n\n  \
    \  server_args = engine.tokenizer_manager.server_args\n    dp_size = server_args.dp_size\n\
    \    sampling_params = {\n        \"temperature\": 0.0,\n        \"max_new_tokens\"\
    : 8,\n        \"ignore_eos\": True,\n    }\n\n    async def _warmup_dp_rank(dp_rank:\
    \ int) -> None:\n        results = await engine.async_generate(\n            input_ids=[10,\
    \ 11, 12, 13],\n            sampling_params=sampling_params,\n            stream=True,\n\
    \            bootstrap_host=FAKE_BOOTSTRAP_HOST,\n            bootstrap_port=bootstrap_port,\n\
    \            bootstrap_room=dp_rank,\n            routed_dp_rank=dp_rank,\n  \
    \      )\n        async for _ in results:\n            pass\n\n    async def _do_warmup()\
    \ -> None:\n        await asyncio.gather(*(_warmup_dp_rank(i) for i in range(dp_size)))\n\
    \n    logging.info(\"SGLang prefill warmup starting...\")\n    await asyncio.wait_for(_do_warmup(),\
    \ timeout=_PREFILL_WARMUP_TIMEOUT_S)\n    logging.info(\"SGLang prefill warmup\
    \ complete\")\n"
