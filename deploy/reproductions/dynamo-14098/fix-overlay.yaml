    \n        super().cleanup()\n        self.engine.shutdown()\n        logging.info(\"\
    Prefill engine shutdown\")\n\n    async def generate(\n        self, request:\
    \ Dict[str, Any], context: Context\n    ) -> AsyncGenerator[Dict[str, Any], None]:\n\
    \        \"\"\"Generate prefill output and provide bootstrap info for decode worker.\n\
