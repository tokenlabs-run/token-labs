    \ = {}\n\n        # Use Future pattern for request ID - will be set when first\
    \ response arrives\n        request_id_future: asyncio.Future[str] = asyncio.Future()\n\
    \        first_output_seen = False\n        async with self._cancellation_monitor(request_id_future,\
    \ context):\n            async for res in stream_source:\n                meta_info\
