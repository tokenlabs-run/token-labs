inferencePool:
  targetPorts:
    - number: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/model: nemotron35-lightning-llm-d

inferenceExtension:
  replicas: 1
  image:
    registry: ghcr.io
    repository: llm-d/llm-d-router-endpoint-picker
    tag: v0.10.0
    pullPolicy: IfNotPresent
  extProcPort: 9002
  pluginsConfigFile: "pd-config.yaml"
  pluginsCustomConfig:
    pd-config.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
      - name: prefill-pods
        type: label-selector-filter
        parameters:
          matchExpressions:
          - key: llm-d.ai/role
            operator: In
            values: [prefill]
      - name: decode-pods
        type: label-selector-filter
        parameters:
          matchExpressions:
          - key: llm-d.ai/role
            operator: In
            values: [decode]
      - name: random-picker
        type: random-picker
      - name: always-pd
        type: always-disagg-pd-decider
      - name: disagg-handler
        type: disagg-profile-handler
        parameters:
          profiles:
            prefill: prefill
            decode: decode
          deciders:
            prefill: always-pd
      schedulingProfiles:
      - name: prefill
        plugins:
        - pluginRef: prefill-pods
        - pluginRef: random-picker
      - name: decode
        plugins:
        - pluginRef: decode-pods
        - pluginRef: random-picker
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: ["amd64"]
provider:
  name: none
