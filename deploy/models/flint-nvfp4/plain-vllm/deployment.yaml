# Isolated candidate only; promotion requires MODEL_ROLLOUT_RUNBOOK.md.
# Build the PR-pinned runtime via the ConfigMap generated by kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flint-nvfp4-vllm-green
  namespace: token-labs
spec:
  replicas: 1
  minReadySeconds: 600
  progressDeadlineSeconds: 7200
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: flint-nvfp4-vllm-green
  template:
    metadata:
      labels:
        app: flint-nvfp4-vllm-green
        token-labs/model-id: flint-nvfp4
        token-labs/slot: green
        token-labs/scenario: isolated-candidate
      annotations:
        token-labs/vllm-source: https://github.com/vllm-project/vllm/pull/62938
        token-labs/vllm-commit: aed08d76a682f1475957c0730ea1f5ecb150fda0
    spec:
      runtimeClassName: nvidia
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
        nvidia.com/gpu.product: NVIDIA-GB10
        kubernetes.io/hostname: spark-01
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      terminationGracePeriodSeconds: 300
      initContainers:
      - name: download-model
        image: vllm/vllm-openai:flint@sha256:5641d14b70c991f8b78c3a5baf0281cb73dbd2ea69932dd6a328820f420ec4bc
        command:
        - python3
        - -c
        args:
        - "from huggingface_hub import snapshot_download\nsnapshot_download(\n   \
          \ \"RecursiveSI/flint\",\n    revision=\"2a247be0c0aec895ccb0ac7ca92229ec6df37288\"\
          ,\n    cache_dir=\"/model-cache/hub\",\n    allow_patterns=[\"*.json\",\
          \ \"*.model\", \"*.tiktoken\", \"*.jinja\", \"*.txt\"],\n)\nsnapshot_download(\n\
          \    \"RecursiveSI/flint-nvfp4-gguf\",\n    revision=\"6ec43e19b565fc8d560e2d04985d7724f20673bf\"\
          ,\n    cache_dir=\"/model-cache/hub\",\n    allow_patterns=[\"flint-nvfp4.gguf\"\
          ],\n)\n"
        env: &id001
        - name: HF_HOME
          value: /model-cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
        - name: PYTHONPATH
          value: /runtime/site-packages
        - name: VLLM_USE_RUST_FRONTEND
          value: '0'
        resources:
          requests:
            cpu: '1'
            memory: 2Gi
          limits:
            cpu: '4'
            memory: 8Gi
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
      - name: build-vllm-pr
        image: vllm/vllm-openai:flint@sha256:5641d14b70c991f8b78c3a5baf0281cb73dbd2ea69932dd6a328820f420ec4bc
        command:
        - python3
        - /build/build-pr-runtime.py
        env: *id001
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            cpu: '8'
            memory: 16Gi
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: pr-runtime
          mountPath: /runtime
        - name: pr-build-script
          mountPath: /build
          readOnly: true
      containers:
      - name: vllm
        image: vllm/vllm-openai:flint@sha256:5641d14b70c991f8b78c3a5baf0281cb73dbd2ea69932dd6a328820f420ec4bc
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -m
        - vllm.entrypoints.cli.main
        - serve
        args:
        - /model-cache/hub/models--RecursiveSI--flint-nvfp4-gguf/snapshots/6ec43e19b565fc8d560e2d04985d7724f20673bf/flint-nvfp4.gguf
        - --hf-config-path
        - /model-cache/hub/models--RecursiveSI--flint/snapshots/2a247be0c0aec895ccb0ac7ca92229ec6df37288
        - --tokenizer
        - /model-cache/hub/models--RecursiveSI--flint/snapshots/2a247be0c0aec895ccb0ac7ca92229ec6df37288
        - --served-model-name
        - RecursiveSI/flint
        - --tensor-parallel-size
        - '1'
        - --dtype
        - bfloat16
        - --kv-cache-dtype
        - auto
        - --max-model-len
        - '32768'
        - --max-num-seqs
        - '4'
        - --gpu-memory-utilization
        - '0.70'
        - --enable-auto-tool-choice
        - --tool-call-parser
        - glm47
        - --reasoning-parser
        - glm47
        - --exclude-tools-when-tool-choice-none
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        env: *id001
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: '4'
            memory: 64Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '12'
            memory: 112Gi
            nvidia.com/gpu: '1'
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 180
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          failureThreshold: 5
          timeoutSeconds: 5
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: shm
          mountPath: /dev/shm
        - name: pr-runtime
          mountPath: /runtime
          readOnly: true
      volumes:
      - name: model-cache
        hostPath:
          path: /home/nvidia/.cache/huggingface
          type: Directory
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
      - name: pr-runtime
        emptyDir: {}
      - name: pr-build-script
        configMap:
          name: flint-vllm-pr-aed08d76
          defaultMode: 292
---
apiVersion: v1
kind: Service
metadata:
  name: flint-nvfp4-green
  namespace: token-labs
spec:
  type: ClusterIP
  selector:
    app: flint-nvfp4-vllm-green
    token-labs/model-id: flint-nvfp4
    token-labs/slot: green
  ports:
  - name: http
    port: 8000
    targetPort: http
