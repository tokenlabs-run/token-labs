apiVersion: v1
kind: Service
metadata:
  name: flint-provider-metrics
  namespace: token-labs
  labels:
    token-labs/metrics: flint
spec:
  selector:
    token-labs/model-id: flint-nvfp4
    token-labs/slot: green
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flint-provider
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [token-labs]
  selector:
    matchLabels:
      token-labs/metrics: flint
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
