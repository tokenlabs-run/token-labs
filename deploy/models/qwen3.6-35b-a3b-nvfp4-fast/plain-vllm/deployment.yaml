apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen36-35b-nvfp4-vllm-green
  namespace: token-labs
  labels: &labels
    app: qwen36-35b-nvfp4-vllm-green
    token-labs/model: "true"
    token-labs/model-id: qwen36-35b-nvfp4
    token-labs/slot: green
    token-labs/version: 1c3f884bc99aac2524f6d49bcbac8c88401afd66
    token-labs/scenario: openrouter-production-candidate
spec:
  replicas: 1
  # Green is active production. Never apply a pod-template change in place;
  # create and validate a separate blue Deployment on independent capacity,
  # then switch only the stable Service selector.
  progressDeadlineSeconds: 1800
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: qwen36-35b-nvfp4-vllm-green}
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector: {kubernetes.io/hostname: spark-01}
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      terminationGracePeriodSeconds: 120
      containers:
      - name: vllm
        # Verify this image contains vLLM >=0.25.0, flashinfer-python >=0.6.13,
        # and nvidia-cutlass-dsl >=4.5.2 before promotion.
        image: vllm/vllm-openai:v0.25.0
        imagePullPolicy: IfNotPresent
        command: [vllm]
        args:
        - serve
        - unsloth/Qwen3.6-35B-A3B-NVFP4-Fast
        - --revision
        - 1c3f884bc99aac2524f6d49bcbac8c88401afd66
        - --served-model-name
        - unsloth/qwen3.6-35b-a3b-nvfp4-fast
        - --tensor-parallel-size
        - "1"
        - --max-model-len
        - "131072"
        - --max-num-seqs
        - "16"
        - --gpu-memory-utilization
        - "0.85"
        - --moe-backend
        - flashinfer_b12x
        - --reasoning-parser
        - qwen3
        - --trust-remote-code
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        env:
        - {name: CUTE_DSL_ARCH, value: sm_121a}
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: hf-token, key: HF_TOKEN}
        - {name: USER, value: vllm}
        - {name: LOGNAME, value: vllm}
        - {name: HOME, value: /tmp}
        - {name: XDG_CACHE_HOME, value: /tmp/.cache}
        - {name: HF_HOME, value: /model-cache}
        - {name: HF_HUB_CACHE, value: /model-cache/hub}
        - {name: FLASHINFER_WORKSPACE_DIR, value: /tmp/.cache/flashinfer}
        - {name: TRITON_CACHE_DIR, value: /tmp/.triton-cache}
        - {name: VLLM_CACHE_ROOT, value: /tmp/vllm-cache}
        - {name: TORCHINDUCTOR_CACHE_DIR, value: /tmp/torchinductor-cache}
        - {name: PYTHONUNBUFFERED, value: "1"}
        ports:
        - {name: http, containerPort: 8000}
        resources:
          requests: {cpu: "4", memory: 48Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "8", memory: 112Gi, nvidia.com/gpu: "1"}
        startupProbe:
          httpGet: {path: /v1/models, port: http}
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 180
          timeoutSeconds: 10
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 30
          failureThreshold: 5
          timeoutSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1002
          runAsGroup: 1003
          allowPrivilegeEscalation: false
        volumeMounts:
        - {name: model-cache, mountPath: /model-cache}
        - {name: shm, mountPath: /dev/shm}
      volumes:
      - name: model-cache
        hostPath: {path: /home/nvidia/.cache/huggingface, type: Directory}
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 32Gi}
---
# Stable public backend. The tested green slot is the active production slot;
# rollback is a one-field selector change back to blue.
apiVersion: v1
kind: Service
metadata:
  name: qwen36-35b-nvfp4
  namespace: token-labs
  labels: {token-labs/model: "true"}
spec:
  selector:
    token-labs/model-id: qwen36-35b-nvfp4
    token-labs/slot: green
  ports:
  - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen36-35b-nvfp4-green
  namespace: token-labs
spec:
  selector:
    token-labs/model-id: qwen36-35b-nvfp4
    token-labs/slot: green
  ports:
  - {name: http, port: 8000, targetPort: http}
