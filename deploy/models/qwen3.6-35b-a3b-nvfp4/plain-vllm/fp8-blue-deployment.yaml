apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen36-35b-fp8-vllm-blue
  namespace: token-labs
  labels: &labels
    app: qwen36-35b-fp8-vllm-blue
    token-labs/model-id: qwen36-35b-fp8
    token-labs/slot: blue
    token-labs/version: 95a723d08a9490559dae23d0cff1d9466213d989
    token-labs/scenario: fp8-throughput-candidate
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: qwen36-35b-fp8-vllm-blue}
  template:
    metadata:
      labels: *labels
    spec:
      nodeSelector: {kubernetes.io/hostname: spark-02}
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      terminationGracePeriodSeconds: 120
      initContainers:
      - name: prepare-model-cache
        image: vllm/vllm-openai:v0.25.0
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        args:
        - >-
          mkdir -p
          /model-cache/hub/models--Qwen--Qwen3.6-35B-A3B-FP8
          /model-cache/hub/.locks/models--Qwen--Qwen3.6-35B-A3B-FP8
          && chown -R 1002:1003
          /model-cache/hub/models--Qwen--Qwen3.6-35B-A3B-FP8
          /model-cache/hub/.locks/models--Qwen--Qwen3.6-35B-A3B-FP8
        securityContext: {runAsUser: 0, runAsGroup: 0}
        volumeMounts:
        - {name: model-cache, mountPath: /model-cache}
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.25.0
        imagePullPolicy: IfNotPresent
        command: [vllm]
        args:
        - serve
        - Qwen/Qwen3.6-35B-A3B-FP8
        - --revision
        - 95a723d08a9490559dae23d0cff1d9466213d989
        - --served-model-name
        - qwen/qwen3.6-35b-a3b-fp8
        - --tensor-parallel-size
        - "1"
        - --max-model-len
        - "131072"
        - --max-num-seqs
        - "128"
        - --max-num-batched-tokens
        - "8192"
        - --gpu-memory-utilization
        - "0.85"
        - --reasoning-parser
        - qwen3
        - --trust-remote-code
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: hf-token, key: HF_TOKEN}
        - {name: USER, value: vllm}
        - {name: LOGNAME, value: vllm}
        - {name: HOME, value: /tmp}
        - {name: XDG_CACHE_HOME, value: /tmp/.cache}
        - {name: HF_HOME, value: /model-cache}
        - {name: HF_HUB_CACHE, value: /model-cache/hub}
        - {name: FLASHINFER_WORKSPACE_DIR, value: /tmp/.cache/flashinfer}
        - {name: TRITON_CACHE_DIR, value: /tmp/.triton-cache}
        - {name: VLLM_CACHE_ROOT, value: /tmp/vllm-cache}
        - {name: TORCHINDUCTOR_CACHE_DIR, value: /tmp/torchinductor-cache}
        - {name: PYTHONUNBUFFERED, value: "1"}
        ports:
        - {name: http, containerPort: 8000}
        resources:
          requests: {cpu: "4", memory: 56Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "8", memory: 112Gi, nvidia.com/gpu: "1"}
        startupProbe:
          httpGet: {path: /v1/models, port: http}
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 180
          timeoutSeconds: 10
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 30
          failureThreshold: 5
          timeoutSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1002
          runAsGroup: 1003
          allowPrivilegeEscalation: false
        volumeMounts:
        - {name: model-cache, mountPath: /model-cache}
        - {name: shm, mountPath: /dev/shm}
      volumes:
      - name: model-cache
        hostPath: {path: /home/nvidia/.cache/huggingface, type: Directory}
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 32Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen36-35b-fp8-blue
  namespace: token-labs
spec:
  selector: {app: qwen36-35b-fp8-vllm-blue}
  ports:
  - {name: http, port: 8000, targetPort: http}
