# Separate CPU frontend; uses the existing DGD worker discovery namespace.
# Never apply pod-template changes while this slot is selected by the stable Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen36-nvfp4-frontend-blue
  namespace: token-labs
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: &id001
      token-labs/model-id: qwen36-nvfp4-frontend
      token-labs/slot: blue
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - args:
        - -m
        - dynamo.frontend
        - --trust-remote-code
        - --enable-anthropic-api
        - --namespace
        - token-labs-qwen36-nvfp4-dynamo-agg
        command:
        - python3
        env:
        - name: DYNAMO_PORT
          value: '8000'
        - name: DYN_COMPONENT
          value: frontend
        - name: DYN_DISCOVERY_BACKEND
          value: kubernetes
        - name: DYN_ENABLE_EXPERIMENTAL_PARSERS_V2
          value: '1'
        - name: DYN_HTTP_BODY_LIMIT_MB
          value: '200'
        - name: DYN_HTTP_PORT
          value: '8000'
        - name: DYN_LOG
          value: info,dynamo_llm=trace
        - name: DYN_NAMESPACE
          value: token-labs-qwen36-nvfp4-dynamo-agg
        - name: DYN_NAMESPACE_PREFIX
          value: token-labs-qwen36-nvfp4-dynamo-agg
        - name: DYN_PARENT_DGD_K8S_NAME
          value: qwen36-nvfp4-dynamo-agg
        - name: DYN_PARENT_DGD_K8S_NAMESPACE
          value: token-labs
        - name: HF_HOME
          value: /model-cache
        - name: HF_HUB_OFFLINE
          value: '0'
        - name: HF_MODULES_CACHE
          value: /tmp/hf_modules
        - name: NATS_SERVER
          value: nats://dynamo-platform-nats.dynamo-system.svc.cluster.local:4222
        - name: NCCL_IB_DISABLE
          value: '1'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: PROMETHEUS_ENDPOINT
          value: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        image: elizabetht/dynamo-frontend@sha256:f8f545ec6e2737545004056dee85259622ae9966230c56382e9eb7bdb7a01756
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /live
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: main
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 2Gi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 60
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /model-cache
          name: shared-model-cache
        - mountPath: /dev/shm
          name: shared-memory
      nodeSelector:
        kubernetes.io/hostname: controller
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 300
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 300
      serviceAccountName: qwen36-nvfp4-dynamo-agg-k8s-service-discovery
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      volumes:
      - hostPath:
          path: /home/nvidia/.cache/huggingface
          type: Directory
        name: shared-model-cache
      - emptyDir:
          medium: Memory
          sizeLimit: 8Gi
        name: shared-memory
