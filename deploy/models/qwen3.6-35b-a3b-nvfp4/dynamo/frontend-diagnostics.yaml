# Diagnostic Services never receive public traffic.
apiVersion: v1
kind: Service
metadata:
  name: qwen36-nvfp4-frontend-blue
  namespace: token-labs
  labels:
    token-labs/frontend-role: diagnostic
spec:
  selector:
    token-labs/model-id: qwen36-nvfp4-frontend
    token-labs/slot: blue
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: qwen36-nvfp4-frontend-green
  namespace: token-labs
  labels:
    token-labs/frontend-role: diagnostic
spec:
  selector:
    token-labs/model-id: qwen36-nvfp4-frontend
    token-labs/slot: green
  ports:
  - name: http
    port: 8000
    targetPort: http
