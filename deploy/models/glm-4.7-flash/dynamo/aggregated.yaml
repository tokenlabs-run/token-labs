# Aggregated Dynamo: each worker performs both prefill and decode.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: glm47-flash-dynamo-agg
  namespace: token-labs
  labels:
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/hostname: controller
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime@sha256:d7f73fdc1a66d2e1e0bdec2a74f49093ff6c85bc5e9f5ddf8296634418abe761
          imagePullPolicy: IfNotPresent
          command:
          - python3
          args:
          - -m
          - dynamo.frontend
          - --trust-remote-code
          - --enable-anthropic-api
          - --namespace
          - token-labs-glm47-flash-dynamo-agg
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: DYN_HTTP_BODY_LIMIT_MB
            value: '200'
          - name: HF_HOME
            value: /model-cache
          - name: HF_HUB_OFFLINE
            value: '0'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: NCCL_IB_DISABLE
            value: '1'
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
            limits:
              cpu: '2'
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 60
          volumeMounts:
          - name: shared-model-cache
            mountPath: /model-cache
        volumes:
        - name: shared-model-cache
          hostPath:
            path: /home/nvidia/.cache/huggingface
            type: Directory
  - name: VllmWorker
    type: worker
    replicas: 1
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/hostname: spark-01
        terminationGracePeriodSeconds: 120
        tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        containers:
        - name: main
          image: elizabetht/dynamo-vllm@sha256:48aa2ca8ba779d4266d9b441e78bd57842d93e1c74c68aadfcb8cacd1610e30d
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model
          - zai-org/GLM-4.7-Flash
          - --revision
          - 7dd20894a642a0aa287e9827cb1a1f7f91386b67
          - --served-model-name
          - zai-org/GLM-4.7-Flash
          - --trust-remote-code
          - --tensor-parallel-size
          - '1'
          - --max-model-len
          - '202752'
          - --max-num-seqs
          - '4'
          - --gpu-memory-utilization
          - '0.80'
          - --enable-prefix-caching
          - --dyn-tool-call-parser
          - glm47
          - --dyn-reasoning-parser
          - glm45
          env:
          - name: HF_HOME
            value: /model-cache
          - name: HF_HUB_CACHE
            value: /model-cache/hub
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: TRITON_CACHE_DIR
            value: /tmp/triton
          - name: VLLM_CACHE_ROOT
            value: /tmp/vllm
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          resources:
            requests:
              cpu: '4'
              memory: 64Gi
              nvidia.com/gpu: '1'
            limits:
              cpu: '12'
              memory: 112Gi
              nvidia.com/gpu: '1'
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          volumeMounts:
          - name: cache
            mountPath: /model-cache
          - name: shm
            mountPath: /dev/shm
        volumes:
        - name: cache
          hostPath:
            path: /home/nvidia/.cache/huggingface
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
