apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: glm47-flash-dynamo-disagg
  labels:
    app.kubernetes.io/name: vllm-disagg-gb10-dspark
    app.kubernetes.io/part-of: dynamo
    token-labs/scenario: glm47-flash-control
  namespace: token-labs
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          nodeSelector:
            kubernetes.io/hostname: controller
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
              imagePullPolicy: IfNotPresent
              command:
                - python3
              args:
                - -m
                - dynamo.frontend
                - --trust-remote-code
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: DYN_HTTP_BODY_LIMIT_MB
                  value: '200'
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: '0'
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: NCCL_IB_DISABLE
                  value: "1"
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              startupProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 10
                timeoutSeconds: 60
                failureThreshold: 60
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /model-cache
          volumes:
            - name: shared-model-cache
              hostPath:
                path: /home/nvidia/.cache/huggingface
                type: Directory
    - name: VllmPrefillWorker
      type: prefill
      replicas: 1
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          volumes:
            - name: shared-model-cache
              hostPath:
                path: /home/nvidia/.cache/huggingface
                type: Directory
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 40Gi
          containers:
            - name: main
              image: elizabetht/dynamo-vllm@sha256:48aa2ca8ba779d4266d9b441e78bd57842d93e1c74c68aadfcb8cacd1610e30d
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/
              command:
                - python3
              args:
                - -m
                - dynamo.vllm
                - --model
                - zai-org/GLM-4.7-Flash
                - --served-model-name
                - glm-4.7-flash
                - --trust-remote-code
                - --tensor-parallel-size
                - "1"
                - --max-model-len
                - "8192"
                - --max-num-seqs
                - "1"
                - --gpu-memory-utilization
                - "0.85"
                - --enable-prefix-caching
                - --dyn-tool-call-parser
                - "glm47"
                - --dyn-reasoning-parser
                - "glm45"
                - --kv-transfer-config
                - '{"kv_connector":"MooncakeConnector","kv_role":"kv_producer","kv_connector_extra_config":{"mooncake_protocol":"tcp"}}'
                - --disaggregation-mode
                - prefill
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: '0'
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: VLLM_CONFIG_ROOT
                  value: /tmp/vllm-config
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
                - name: VLLM_WORKER_MULTIPROC_METHOD
                  value: "spawn"
                - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
                  value: '8998'
                - name: VLLM_HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: MC_FORCE_TCP
                  value: '1'
                - name: DYN_VLLM_MOONCAKE_BOOTSTRAP_ADVERTISE_HOST
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: PYTHONHASHSEED
                  value: '0'
                - name: NCCL_IB_DISABLE
                  value: "1"
              resources:
                requests:
                  cpu: "4"
                  memory: 64Gi
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "8"
                  memory: 96Gi
                  nvidia.com/gpu: "1"
              securityContext:
                runAsUser: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_RESOURCE
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 120
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /model-cache
                - name: dshm
                  mountPath: /dev/shm
          nodeSelector:
            kubernetes.io/hostname: spark-02
    - name: VllmDecodeWorker
      type: decode
      replicas: 1
      sharedMemorySize: 40Gi
      podTemplate:
        spec:
          volumes:
            - name: shared-model-cache
              hostPath:
                path: /home/nvidia/.cache/huggingface
                type: Directory
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 40Gi
          containers:
            - name: main
              image: elizabetht/dynamo-vllm@sha256:48aa2ca8ba779d4266d9b441e78bd57842d93e1c74c68aadfcb8cacd1610e30d
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/
              command:
                - python3
              args:
                - -m
                - dynamo.vllm
                - --model
                - zai-org/GLM-4.7-Flash
                - --served-model-name
                - glm-4.7-flash
                - --trust-remote-code
                - --tensor-parallel-size
                - "1"
                - --max-model-len
                - "8192"
                - --max-num-seqs
                - "1"
                - --gpu-memory-utilization
                - "0.85"
                - --enable-prefix-caching
                - --dyn-tool-call-parser
                - "glm47"
                - --dyn-reasoning-parser
                - "glm45"
                - --kv-transfer-config
                - '{"kv_connector":"MooncakeConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"mooncake_protocol":"tcp"}}'
                - --disaggregation-mode
                - decode
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /model-cache
                - name: HF_HUB_OFFLINE
                  value: '0'
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: VLLM_CONFIG_ROOT
                  value: /tmp/vllm-config
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
                - name: VLLM_WORKER_MULTIPROC_METHOD
                  value: "spawn"
                - name: VLLM_MOONCAKE_BOOTSTRAP_PORT
                  value: '8998'
                - name: VLLM_HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: MC_FORCE_TCP
                  value: '1'
                - name: PYTHONHASHSEED
                  value: '0'
                - name: NCCL_IB_DISABLE
                  value: "1"
              resources:
                requests:
                  cpu: "4"
                  memory: 64Gi
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "8"
                  memory: 96Gi
                  nvidia.com/gpu: "1"
              securityContext:
                runAsUser: 0
                capabilities:
                  add:
                    - IPC_LOCK
                    - SYS_RESOURCE
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 120
              volumeMounts:
                - name: shared-model-cache
                  mountPath: /model-cache
                - name: dshm
                  mountPath: /dev/shm
          nodeSelector:
            kubernetes.io/hostname: spark-01
