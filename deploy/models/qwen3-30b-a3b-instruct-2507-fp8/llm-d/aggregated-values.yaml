# llm-d ModelService — Qwen3 30B A3B Instruct 2507 FP8 (stable control workload)
multinode: false
accelerator:
  type: nvidia
  dra: false
  resources:
    nvidia: nvidia.com/gpu.shared
modelArtifacts:
  uri: "hf://Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
  size: 40Gi
  authSecretName: "hf-token"
  name: "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8-llm-d"
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: qwen3-30b-control-llm-d
    llm-d.ai/hardware-variant: "gpu"
    llm-d.ai/accelerator-vendor: "nvidia"
    token-labs/scenario: qwen3-30b-control
routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.10.0
    imagePullPolicy: IfNotPresent
    connector: nixlv2
    secure: false
decode:
  parallelism:
    tensor: 1
  create: true
  replicas: 1
  strategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: spark-01
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["spark-01"]
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: vllm
      image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.1
      imagePullPolicy: IfNotPresent
      modelCommand: vllmServe
      securityContext:
        # UID/GID must match the `nvidia` account on the pinned node so the
        # hostPath HF cache stays writable: spark-01 is 1002:1003, spark-02
        # is 1001:1001. Without this the image's default uid 1000 (dynamo)
        # can read the cache but cannot create a new models--* directory,
        # so any model not already cached dies with PermissionError.
        runAsNonRoot: true
        runAsUser: 1002
        runAsGroup: 1003
        allowPrivilegeEscalation: false
      startupProbe:
        httpGet:
          path: /v1/models
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 180
        timeoutSeconds: 10
      readinessProbe:
        httpGet:
          path: /v1/models
          port: 8000
        periodSeconds: 15
        failureThreshold: 3
        timeoutSeconds: 10
      args:
        # No explicit --served-model-name: the modelservice chart injects one
        # from modelArtifacts.name (the -llm-d suffixed value). A second flag
        # here is appended after it and wins, silently reverting the served name
        # to the bare one the gateway does not route. Matches the Nemotron llm-d
        # values, which set the served name only via modelArtifacts.
        - --max-model-len
        - "32768"
        - --max-num-seqs
        - "1"
        - --gpu-memory-utilization
        - "0.40"
        - --enable-prefix-caching
        - --trust-remote-code
      env:
        # Non-root uid 1002 has no /etc/passwd entry in this image, so any
        # library calling getpass.getuser() (torch inductor does, via
        # default_cache_dir) dies with KeyError: getpwuid(). Pointing every
        # cache root at an explicit writable path avoids that lookup and
        # keeps writes off the read-only image layers. Mirrors the Nemotron
        # llm-d values.
        # torch inductor's codecache calls default_cache_dir() directly,
        # which calls getpass.getuser() unconditionally -- TORCHINDUCTOR_CACHE_DIR
        # does not short-circuit that path. getpass.getuser() consults these
        # env vars before falling back to pwd.getpwuid(), so setting them is
        # what actually keeps uid 1002 (absent from the image's /etc/passwd)
        # from raising KeyError: getpwuid().
        - name: USER
          value: nvidia
        - name: LOGNAME
          value: nvidia
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: FLASHINFER_WORKSPACE_DIR
          value: /tmp/.cache/flashinfer
        - name: TRITON_CACHE_DIR
          value: /tmp/.triton-cache
        - name: VLLM_CACHE_ROOT
          value: /tmp/vllm-cache
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /tmp/torchinductor-cache
        - name: HF_HOME
          value: /model-cache
        - name: HF_HUB_CACHE
          value: /model-cache/hub
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: HF_HUB_DISABLE_XET
          value: "1"
        - name: FLASHINFER_DISABLE_VERSION_CHECK
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
      resources:
        requests:
          cpu: "4"
          memory: 32Gi
          nvidia.com/gpu.shared: "1"
        limits:
          cpu: "8"
          memory: 56Gi
          nvidia.com/gpu.shared: "1"
      volumeMounts:
        - name: model-cache
          mountPath: /model-cache
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: model-cache
      hostPath:
        path: /home/nvidia/.cache/huggingface
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
prefill:
  create: false
