# Copy to openrouter-synthetic-monitor-secret.yaml, fill in values, and apply it
# out-of-band. Never commit the populated Secret.
apiVersion: v1
kind: Secret
metadata:
  name: openrouter-synthetic-monitor
  namespace: monitoring
type: Opaque
stringData:
  TOKEN_LABS_API_KEY: replace-with-a-dedicated-monitoring-key
  TOKEN_LABS_MODEL: replace-with-the-exact-openrouter-model-id
