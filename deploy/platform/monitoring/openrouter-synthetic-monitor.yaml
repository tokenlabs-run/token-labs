apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrouter-synthetic-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: openrouter-synthetic-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openrouter-synthetic-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openrouter-synthetic-monitor
    spec:
      containers:
        - name: monitor
          image: ghcr.io/elizabetht/token-labs-openrouter-monitor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: metrics, containerPort: 9101}
          env:
            - {name: TOKEN_LABS_BASE_URL, value: "https://api.tokenlabs.run"}
            - {name: PROBE_INTERVAL_SECONDS, value: "30"}
            - {name: PROBE_TIMEOUT_SECONDS, value: "25"}
            - {name: PROBE_MAX_TOKENS, value: "16"}
          envFrom:
            - secretRef: {name: openrouter-synthetic-monitor}
          readinessProbe:
            httpGet: {path: /, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: openrouter-synthetic-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: openrouter-synthetic-monitor
spec:
  selector:
    app.kubernetes.io/name: openrouter-synthetic-monitor
  ports:
    - {name: metrics, port: 9101, targetPort: metrics}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openrouter-synthetic-monitor
  namespace: monitoring
  labels: {release: kube-prometheus-stack}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openrouter-synthetic-monitor
  endpoints:
    - {port: metrics, interval: 15s, scrapeTimeout: 5s}
