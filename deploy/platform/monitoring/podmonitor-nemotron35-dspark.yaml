# PodMonitor for the nemotron35-dspark llm-d vs dynamo comparison.
#
# Why a PodMonitor and not a ServiceMonitor like the others in this directory:
# the llm-d-modelservice chart creates the `nemotron35-llm-d` Service with NO
# labels, so a ServiceMonitor selector cannot match it. The *pods* are labelled,
# and dynamo will create its own Service shape anyway -- selecting pods on a
# token-labs-owned label keeps one monitor working across both stacks.
#
# `release: kube-prometheus-stack` is mandatory: the Prometheus instance sets
# podMonitorSelector.matchLabels to exactly that, so a monitor without it is
# silently ignored (no error, no target, no metrics).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nemotron35-dspark-comparison
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [token-labs]
  selector:
    matchLabels:
      token-labs/scenario: nemotron35-dspark
  # Two endpoints because the stacks expose metrics on different ports:
  #   llm-d decode      -> 8000   (vLLM's own OpenAI server)
  #   dynamo frontend   -> 8000   (dynamo HTTP frontend)
  #   dynamo agg worker -> 9090   ("system" port; this is where the 401 vllm:*
  #                                engine series live -- NOT on 8000)
  # A pod only produces a target for a port it actually declares, so listing
  # both is safe: each pod contributes exactly the endpoints it has. Scraping
  # only 8000 (the original config) silently missed every Dynamo engine metric.
  podMetricsEndpoints:
  - targetPort: 8000
    path: /metrics
    # 15s rather than the 60s used by the older ServiceMonitors -- benchmark
    # runs are short and 60s buckets smear the interesting transitions.
    interval: 15s
    scrapeTimeout: 10s
    relabelings: &stackRelabelings
    # Keep the node name: the whole point is spark-01 vs spark-02.
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    # Distinguish the two serving stacks. Without this, series from both
    # deployments are identical except for `node`, so a query like
    # sum(rate(vllm:generation_tokens_total[1m])) silently adds llm-d and
    # dynamo together and reports a number that describes neither.
    #
    # Each stack is identified by a label only it sets. `regex: (.+)` matters:
    # a replace action is skipped when the regex does not match, so the llm-d
    # rule is a no-op on dynamo pods and vice versa. Without the guard the
    # second rule would overwrite `stack` with an empty string on llm-d pods.
    - sourceLabels: [__meta_kubernetes_pod_label_llm_d_ai_role]
      regex: (.+)
      targetLabel: stack
      replacement: llm-d
    - sourceLabels: [__meta_kubernetes_pod_label_nvidia_com_dynamo_component]
      regex: (.+)
      targetLabel: stack
      replacement: dynamo
    # Component within the stack: llm-d "decode"/"prefill" vs dynamo
    # "Frontend"/"agg". Lets a panel separate the dynamo HTTP frontend (which
    # reports no engine metrics) from the worker that does.
    - sourceLabels: [__meta_kubernetes_pod_label_llm_d_ai_role]
      regex: (.+)
      targetLabel: role
      replacement: ${1}
    - sourceLabels: [__meta_kubernetes_pod_label_nvidia_com_dynamo_component]
      regex: (.+)
      targetLabel: role
      replacement: ${1}
  - targetPort: 9090
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    relabelings: *stackRelabelings
