apiVersion: v1
kind: ConfigMap
metadata:
  name: token-labs-inference-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  token-labs-inference.json: |
    {
      "uid": "token-labs-inference",
      "title": "Token Labs — Inference Operations",
      "tags": [
        "token-labs",
        "inference",
        "vllm",
        "envoy",
        "llm-d"
      ],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "timezone": "browser",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(vllm:num_requests_running{namespace=\"token-labs\"}, model_name)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "label": "Model",
            "name": "model",
            "options": [],
            "query": {
              "query": "label_values(vllm:num_requests_running{namespace=\"token-labs\"}, model_name)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(DCGM_FI_DEV_GPU_UTIL, Hostname)",
            "hide": 0,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "label": "Node",
            "name": "node",
            "options": [],
            "query": {
              "query": "label_values(DCGM_FI_DEV_GPU_UTIL, Hostname)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Status",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Running Requests",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "orientation": "auto",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              },
              "noValue": "No samples / idle"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(vllm:num_requests_running{namespace=\"token-labs\", model_name=~\"$model\"})",
              "refId": "A",
              "legendFormat": "running"
