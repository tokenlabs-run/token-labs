apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: codex-catalog
  namespace: token-labs
spec:
  parentRefs:
  - name: token-labs-gateway
  hostnames: [api.tokenlabs.run]
  rules:
  - matches:
    - path:
        type: Exact
        value: /codex/models
    backendRefs:
    - name: codex-catalog
      port: 8000
    timeouts:
      request: 10s
