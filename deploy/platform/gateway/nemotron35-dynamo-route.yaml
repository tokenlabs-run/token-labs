# External OpenAI-compatible route for the Nemotron 3.5 Lightning Dynamo
# deployment. Mirrors nemotron35-llm-d-route.yaml so both serving stacks reach
# clients through the same Envoy AI Gateway path -- same ext_proc, same
# model-based routing, same llmRequestCosts token accounting. A fair llm-d vs
# dynamo comparison depends on the ingress path being identical; do NOT expose
# Dynamo via its own `ingress.enabled` (that builds a parallel
# networking.k8s.io/Ingress that bypasses this layer entirely).
#
# Unlike the llm-d route, no Service is declared here: the Dynamo operator
# creates one for the Frontend component. It holds RBAC for core/services,
# networking.k8s.io/ingresses and networking.istio.io/virtualservices, but NOT
# for aigateway.envoyproxy.io -- so the three objects below have to be authored
# by hand.
#
# TODO: confirm the Frontend Service name after the first deploy of
# vllm-agg-gb10-dspark, then replace the hostname below:
#   kubectl apply -f deploy/models/nemotron-3.5-lightning-30b-a3b-nvfp4/dynamo/aggregated.yaml
#   kubectl get svc -n token-labs | grep vllm-agg-gb10-dspark
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: nemotron35-dynamo
  namespace: token-labs
spec:
  endpoints:
    - fqdn:
        hostname: vllm-agg-gb10-dspark-frontend.token-labs.svc.cluster.local
        port: 8000
---
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIServiceBackend
metadata:
  name: nemotron35-dynamo
  namespace: token-labs
spec:
  schema:
    name: OpenAI
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: nemotron35-dynamo
---
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIGatewayRoute
metadata:
  name: nemotron35-dynamo
  namespace: token-labs
spec:
  schema:
    name: OpenAI
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: token-labs-gateway
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              # Must match --served-model-name in dynamo/aggregated.yaml:123
              value: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-dynamo
      backendRefs:
        - name: nemotron35-dynamo
