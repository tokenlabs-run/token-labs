# Native vLLM APIs for Codex Responses and Claude Code Messages.
# Model-specific prefixes select backends without transforming API bodies.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-agent-apis
  namespace: token-labs
spec:
  parentRefs:
  - name: token-labs-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /models/glm/v1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /v1
    backendRefs:
    - name: glm47-flash-agg
      port: 8000
    timeouts:
      request: 3600s
  - matches:
    - path:
        type: PathPrefix
        value: /models/qwen/v1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /v1
    backendRefs:
    - name: qwen36-nvfp4-agg
      port: 8000
    timeouts:
      request: 3600s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: model-agent-apis
  namespace: token-labs
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: model-agent-apis
  extProc:
  - backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: envoy-ai-gateway-extproc-backend
      namespace: token-labs
    failOpen: false
    processingMode: {}
