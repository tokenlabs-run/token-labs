          - '1'
          - --trust-remote-code
          - --disaggregation-mode
          - decode
          - --disaggregation-transfer-backend
          - mooncake
          - --disaggregation-bootstrap-port
          - '12345'
          - --host
          - 0.0.0.0
          - --disable-cuda-graph
          - --disable-piecewise-cuda-graph
          - --mem-fraction-static
          - '0.8'
          - --max-total-tokens
          - '2048'
          - --context-length
          - '1024'
          - --max-running-requests
          - '4'
          command:
          - python3
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: HF_HOME
            value: /model-cache
          - name: HF_HUB_CACHE
            value: /model-cache/hub
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: PYTHONUNBUFFERED
            value: '1'
          - name: MC_FORCE_TCP
            value: '1'
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime-nightly@sha256:8e410361722b5bc52bfdcc6107d374d36a49e45297b30dc54144ab942180abcb
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              cpu: '4'
              memory: 8Gi
              nvidia.com/gpu.shared: '1'
            requests:
              cpu: '2'
              memory: 4Gi
              nvidia.com/gpu.shared: '1'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          volumeMounts:
          - mountPath: /model-cache
            name: model-cache
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /usr/local/lib/python3.12/dist-packages/dynamo/sglang/_disagg.py
            name: issue14098-fix
            readOnly: true
