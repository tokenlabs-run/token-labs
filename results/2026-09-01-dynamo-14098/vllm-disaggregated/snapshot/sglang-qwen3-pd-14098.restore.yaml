        volumes:
        - hostPath:
            path: /home/nvidia/.cache/huggingface
            type: Directory
          name: model-cache
        - emptyDir:
            medium: Memory
            sizeLimit: 2Gi
          name: dshm
        - configMap:
            name: sglang-14098-fix-dce302dd7a
          name: issue14098-fix
    replicas: 1
    sharedMemorySize: 2Gi
    type: decode
